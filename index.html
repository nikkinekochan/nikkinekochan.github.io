<link rel="stylesheet" href="styles.css">



<div class="container">
    <h1>Mesures tierces → FreeWheel Converter</h1>
    <p>Paste a pixel, convert it, then copy the result.</p>

    <label>Pixel</label>
    <textarea id="input" placeholder="Paste pixel here..."></textarea>

    <div class="buttons">
        <button id="convert">Convertir</button>
        <button id="copy">Copier</button>
        <button id="clear">Clear</button>
    </div>

    <label>Pixel with FreeWheel macros</label>
    <textarea id="output" readonly></textarea>

    <div id="status"></div>
</div>

<script src="script.js"></script>
